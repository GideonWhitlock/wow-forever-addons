name: Night Watch Torch bug report
description: Report a reproducible problem with Night Watch Torch Helper.
title: "[Night Watch Torch] "
labels:
  - bug
  - "addon: night-watch-torch"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Night Watch Torch problem. Please remove account details, access tokens, private chat, personal file paths and other private information before submitting.

  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: The version shown in the AddOns list or release filename.
      placeholder: "1.0.2"
    validations:
      required: true

  - type: input
    id: wow_version
    attributes:
      label: WoW: Forever version and build
      description: Include both values when available.
      placeholder: "1.60.1, build 70205"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that causes the problem.
      placeholder: |
        1. Put Night Watchman's Torch in a carried bag.
        2. Type /nwt status.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead? Include the output from /nwt status when relevant.
    validations:
      required: true

  - type: textarea
    id: other_addons
    attributes:
      label: Other relevant add-ons
      description: List add-ons that affect bags, auras, action buttons, the minimap or the user interface. Write "None" if tested without other add-ons.
      placeholder: "Add-on name and version, or None"
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Redacted error text
      description: Paste relevant Lua errors or logs after removing private information. Write "No error shown" if there was no error.
      placeholder: "Paste redacted error text here, or No error shown"
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, day/weather conditions, movement state, buff state or other details that help reproduce the issue.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account details, access tokens, private chat, personal file paths and other information I do not want published.
          required: true

