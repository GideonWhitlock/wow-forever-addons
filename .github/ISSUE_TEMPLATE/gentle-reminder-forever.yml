name: "Gentle Reminder: Forever issue"
description: "Report a private-reminder, timing, delivery or Forever compatibility problem."
title: "[Gentle Reminder: Forever] "
labels:
  - "addon: gentle-reminder-forever"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not paste SavedVariables or personal reminder text. Remove account names, character names, private tasks, medication names, appointments, local paths and other personal information.
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: forever-build
    attributes:
      label: WoW: Forever version and build
      placeholder: "1.60.1.70245"
    validations:
      required: true
  - type: dropdown
    id: reminder-type
    attributes:
      label: Reminder type
      options:
        - Recurring
        - One-off
        - Bedtime
        - Preview
        - Session/daily timer
        - Settings or minimap button
        - Other
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Player state when it happened
      options:
        - Out of combat, no cinematic
        - In combat
        - In a cinematic or movie
        - Login, logout or reload
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: bedtime-basis
    attributes:
      label: Bedtime clock basis
      description: Choose the basis shown beside the bedtime field, or Not applicable.
      options:
        - Not applicable
        - Local time
        - Server time
    validations:
      required: true
  - type: input
    id: observed-clocks
    attributes:
      label: Displayed local/server clocks and offset
      description: For bedtime issues, copy the generic clock summary only. Do not include reminder text or personal details.
      placeholder: "Local 21:30 • Server 16:00 • server −5:30"
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use generic placeholder text instead of your real reminder.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Redacted error text
      description: Remove all reminder text and personal information.
      render: text
  - type: textarea
    id: addons
    attributes:
      label: Other relevant add-ons
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include SavedVariables, personal reminder text, medical details, appointments, account details or private paths.
          required: true

