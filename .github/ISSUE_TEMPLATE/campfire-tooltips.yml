name: Campfire Tooltips: Forever issue
description: Report a reproducible problem with Campfire Tooltips: Forever.
title: "[Campfire Tooltips: Forever] "
labels:
  - "addon: campfire-tooltips"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Campfire Tooltips: Forever problem. Please remove account names, character names, realm names, access tokens, private file paths and unrelated chat text before submitting.

  - type: input
    id: addon_version
    attributes:
      label: Campfire Tooltips: Forever version
      description: The version shown in the add-on list or diagnostic report.
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: wow_version
    attributes:
      label: WoW: Forever version and build
      description: Include both the version and build number if available.
      placeholder: "1.60.1.70205"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the exact object hovered, location or prerequisites, settings used and the shortest repeatable sequence.
      placeholder: |
        1. Opened ...
        2. Hovered ...
        3. Observed ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect Campfire Tooltips to show or do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead? Include whether the original game tooltip still appeared.
    validations:
      required: true

  - type: textarea
    id: other_addons
    attributes:
      label: Other relevant add-ons
      description: List tooltip, UI or camping add-ons that were enabled, or write “None known”.
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Redacted errors or diagnostic details
      description: Paste only the relevant error and Campfire Tooltips: Forever diagnostic lines. Remove personal data, account identifiers and private paths. Do not upload an entire WTF folder.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal information, account details, private paths and access tokens from this report.
          required: true
