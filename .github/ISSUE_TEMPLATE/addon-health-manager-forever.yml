name: Addon Health Manager issue
description: Report a diagnostic, interface, performance or compatibility problem
title: "[Addon Health Manager] "
body:
  - type: markdown
    attributes:
      value: Addon Health Manager reports evidence, not guaranteed conflict or root-cause diagnoses. Remove account names, character/realm names, chat, local paths and SavedVariables before submitting.
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: WoW: Forever version and build
      placeholder: 1.60.1.70338
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What needs attention?
      options:
        - Status or dependency finding
        - Lua-error attribution
        - Performance information
        - Privacy-clean report
        - Recovery or undo action
        - Minimap icon or main window
        - Forever compatibility
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the one-at-a-time retest you performed when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Privacy-clean report
      description: Paste the report generated by /ahm report. Check it once before submitting.
  - type: textarea
    id: errors
    attributes:
      label: Additional redacted error text
      description: Do not include locals, account data, character/realm names, tokens or private chat.
